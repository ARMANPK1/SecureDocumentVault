<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Vault</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Supabase CDN (সবার আগে থাকতে হবে) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container" style="text-align:center; padding:30px; max-width:400px; margin:50px auto; border:1px solid #ddd; border-radius:10px;">
    <h2>🔐 সিকিউর ফাইল ভল্ট</h2>
    <p>ফাইলটি দেখতে সিক্রেট পাসওয়ার্ডটি লিখুন:</p>

    <div style="margin: 20px 0;">
      <input type="password" id="passcodeInput" placeholder="পাসওয়ার্ড লিখুন..." style="padding:12px; width:90%; border-radius:5px; border:1px solid #ccc;">
    </div>

    <button id="submitBtn" style="padding:12px 25px; background:#28a745; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">
      পাসওয়ার্ড যাচাই করুন
      
    <button type="button" id="submitBtn">পাসওয়ার্ড যাচাই করুন</button>

    <!-- রেজাল্ট এরিয়া -->
    <div id="fileContainer" style="display:none; margin-top:25px;">
      <h3>✅ আপনার ফাইল প্রস্তুত!</h3>
      <div id="previewArea" style="margin:15px 0;"></div>
      <a id="downloadLink" href="#" target="_blank" style="display:inline-block; padding:12px 20px; background:#007bff; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold;">📥 ডাউনলোড করুন</a>
    </div>
  </div>

  <!-- ফাইল সিকুয়েন্স সঠিক রাখা হয়েছে -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
