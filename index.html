<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Document Viewer</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
            position: relative;
        }

        /* 🏷️ ডান কোণায় ক্রিয়েটর ক্রেডিট স্টাইল */
        .creator-tag {
            position: fixed;
            top: 15px;
            right: 20px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            z-index: 10000;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* ২য় ভুলের জন্য হলুদ ডিসপ্লে */
        body.yellow-alert {
            background: linear-gradient(135deg, #78350f 0%, #92400e 50%, #451a03 100%) !important;
        }

        /* ৩য় ও ৪র্থ ভুলের জন্য লাল ডিসপ্লে ও শেক এফেক্ট */
        body.red-alert {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #450a0a 100%) !important;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        #securityOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            z-index: 99999;
            color: #ef4444;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .vault-icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }

        h2 { font-size: 24px; color: #ffffff; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 13px; color: #cbd5e1; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        input[type="password"]:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            border-color: rgba(239, 68, 68, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        button:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

        #errorMsg {
            color: #f87171; font-size: 13px; margin-top: 15px; padding: 10px;
            background: rgba(239, 68, 68, 0.1); border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2); display: none;
        }

        #documentBox {
            margin-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;
        }

        .file-item {
            background: rgba(0, 0, 0, 0.3); border-radius: 12px;
            padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* 🌊 ভিউ মোডের ওয়াটারমার্ক ও হালকা ব্লার স্টাইল */
        .file-preview-restricted {
            filter: blur(1px);
            pointer-events: none;
        }

        /* 🌐 পুরো ছবি জুড়েই ছোট ছোট অস্পষ্ট লেখা রিপিট হওয়ার গ্রিড স্টাইল */
        .watermark-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            padding: 10px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            z-index: 5;
            overflow: hidden;
        }

        /* 🟢 ছোট, হালকা এবং অস্পষ্ট টেক্সট স্টাইল */
        .watermark-item {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.35); /* অস্পষ্ট করার জন্য অপাসিটি হালকা রাখা হয়েছে */
            font-size: 10px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.8px;
            transform: rotate(-18deg);
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
        }

        .file-preview { border-radius: 8px; overflow: hidden; max-height: 400px; margin-bottom: 10px; position: relative; }
        .file-preview img { width: 100%; height: auto; pointer-events: none; }
        .file-preview iframe { width: 100%; height: 350px; border: none; }

        .download-btn {
            display: inline-block; padding: 10px 20px; background: #22c55e;
            color: #ffffff; text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer; border: none;
            transition: background 0.3s;
        }

        .download-btn:hover { background: #16a34a; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- 🏷️ উপরের ডান পাশে সাদা টেক্সটে ক্রেডিট -->
    <div class="creator-tag">Created by, B M ARSAD ALI</div>

    <div id="securityOverlay">
        🔒 সিকিউরিটি সতর্কতা!
        <span style="font-size: 14px; color: #cbd5e1; margin-top: 10px;">ব্রাউজার ফোকাস হারিয়েছে বা স্ক্রিন রেকর্ড করার চেষ্টা করা হয়েছে!</span>
    </div>

    <div class="container">
        <div class="vault-icon">🔒</div>
        <h2>Secure Document Vault</h2>
        <p class="subtitle">ফাইলের গোপনীয়তা রক্ষার্থে সঠিক পাসওয়ার্ড দিন</p>

        <div id="authBox">
            <div class="input-group">
                <input type="password" id="customerPasscode" placeholder="সিক্রেট পাসওয়ার্ড লিখুন">
            </div>
            <button id="verifyBtn">ডকুমেন্ট দেখুন</button>
            <p id="errorMsg"></p>
        </div>

        <div id="documentBox" style="display: none;">
            <h3 id="docTitle" style="margin-bottom: 15px; color: #a855f7;"></h3>
            <div id="fileContainer"></div>
        </div>
    </div>

    <!-- 1. Config -->
    <script src="config.js"></script>

    <!-- 2. Logic Script -->
    <script>
        let supabaseClient = null;
        let currentDocumentData = null;
        let wrongAttempts = 0;
        let timerInterval = null;
        let continuousVibrateInterval = null;
        let userIP = "Unknown";
        let userLocation = "Unknown";
        let isDownloadMode = false;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function fetchUserIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                userIP = data.ip || "Unknown";
                userLocation = `${data.city || ''}, ${data.country_name || ''}`;
            } catch (err) {
                try {
                    const fallback = await fetch('https://api.ipify.org?format=json');
                    const fbData = await fallback.json();
                    userIP = fbData.ip;
                } catch(e){}
            }
        }

        // 🟢 রিয়েল-টাইম ইউজার ট্র্যাকিং (অ্যাডমিন প্যানেলে দেখার জন্য)
        function setupPresence() {
            if (!supabaseClient) return;
            const room = supabaseClient.channel('online_users', {
                config: { presence: { key: 'user_' + Date.now() } }
            });
            room.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    await room.track({ online_at: new Date().toISOString() });
                }
            });
        }

        async function logActivity(actionType, details) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('audit_logs').insert([
                    {
                        ip_address: userIP,
                        location: userLocation,
                        file_name: currentDocumentData ? currentDocumentData.file_name : 'Unknown',
                        action: actionType,
                        details: details,
                        created_at: new Date()
                    }
                ]);
            } catch(e) { console.error("Logging failed", e); }
        }

        async function checkIPBlockStatus() {
            if (!userIP || !supabaseClient) return false;
            try {
                const { data } = await supabaseClient
                    .from('blocked_ips')
                    .select('*')
                    .eq('ip_address', userIP)
                    .single();

                if (data) {
                    const unblockTime = new Date(data.blocked_until);
                    if (new Date() < unblockTime) {
                        document.getElementById('authBox').innerHTML = `
                            <div style="background: rgba(239, 68, 68, 0.2); padding: 15px; border-radius: 12px; border: 1px solid #ef4444;">
                                <h4 style="color:#f87171;">🚫 এক্সেস সম্পূর্ণ ব্লক করা হয়েছে!</h4>
                                <p style="font-size: 13px; color: #cbd5e1; margin-top: 8px;">
                                    অতিরিক্ত ভুল পাসওয়ার্ড দেওয়ার কারণে ৩ দিনের জন্য আপনার আইপি ব্লক করা হয়েছে।
                                </p>
                            </div>
                        `;
                        return true;
                    }
                }
            } catch(e){}
            return false;
        }

        async function loadDocumentInfo() {
            initSupabase();
            await fetchUserIP();
            setupPresence();

            const isBlocked = await checkIPBlockStatus();
            if (isBlocked) return;

            const filePath = getQueryParam('file');
            if (!filePath) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ কোনো ফাইলের লিংক পাওয়া যায়নি!</p>';
                return;
            }

            if (!supabaseClient) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">⚠️ Supabase কনফিগারেশন মিসিং!</p>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('file_path', filePath)
                .single();

            if (error || !data) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ ফাইলটি ডাটাবেজে পাওয়া যায়নি!</p>';
                return;
            }

            currentDocumentData = data;
        }

        async function blockUserFor3Days() {
            if (!userIP || !supabaseClient) return;
            const blockedUntil = new Date();
            blockedUntil.setDate(blockedUntil.getDate() + 3);

            await supabaseClient
                .from('blocked_ips')
                .upsert([{ ip_address: userIP, blocked_until: blockedUntil.toISOString() }]);
            
            logActivity("USER_BLOCKED_3_DAYS", "৪টি ভুল পাসওয়ার্ড দেওয়ার জন্য ৩ দিনের জন্য ব্লক করা হয়েছে।");
        }

        function playSingleBeep() {
            try {
                if (navigator.vibrate) navigator.vibrate(200);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function playDoubleBeep() {
            try {
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                playSingleBeep(); setTimeout(playSingleBeep, 200);
            } catch(e) {}
        }

        function playLaughSoundAndVibrate() {
            try {
                if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500, 200, 500]);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                let startTime = ctx.currentTime;
                let notes = [300, 450, 300, 450, 500, 350, 550];
                notes.forEach((freq, index) => {
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'triangle';
                    let noteTime = startTime + (index * 0.12);
                    osc.frequency.setValueAtTime(freq, noteTime);
                    gain.gain.setValueAtTime(0.3, noteTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, noteTime + 0.1);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(noteTime); osc.stop(noteTime + 0.12);
                });
            } catch(e) {}
        }

        function startContinuousVibration() {
            if (navigator.vibrate) {
                navigator.vibrate([1000, 200, 1000, 200]);
                continuousVibrateInterval = setInterval(() => {
                    navigator.vibrate([1000, 200, 1000, 200]);
                }, 2400);
            }
        }

        window.addEventListener('blur', () => {
            if (document.getElementById('documentBox').style.display === 'block') {
                document.getElementById('securityOverlay').style.display = 'flex';
            }
        });

        window.addEventListener('focus', () => {
            document.getElementById('securityOverlay').style.display = 'none';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'PrintScreen' || (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u'))) {
                e.preventDefault();
                alert('⚠️ সিকিউরিটি অ্যালার্ট: স্ক্রিনশট বা সেভ করা সম্পূর্ণ নিষেধ!');
                logActivity("SCREENSHOT_ATTEMPT", "স্ক্রিনশট বা পেজ সেভ করার চেষ্টা করেছে।");
            }
        });

        // পাসওয়ার্ড ভ্যালিডেশন (পাসওয়ার্ড ১ ও ২ চেক)
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const passcodeElement = document.getElementById('customerPasscode');
            const errorMsg = document.getElementById('errorMsg');
            const inputPass = passcodeElement.value.trim();

            if (!currentDocumentData) {
                errorMsg.innerText = "❌ ফাইলের তথ্য লোড হতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।";
                errorMsg.style.display = "block";
                return;
            }

            const viewPass = String(currentDocumentData.passcode || currentDocumentData.password).trim();
            const downloadPass = String(currentDocumentData.download_passcode || '').trim();

            // 🟢 পাসওয়ার্ড ২ (ডাউনলোড পাসওয়ার্ড) দিলে: ওয়াটারমার্কমুক্ত সম্পূর্ণ পরিস্কার ভিউ + ডাউনলোড মোড
            if (downloadPass && inputPass === downloadPass) {
                isDownloadMode = true;
                errorMsg.style.display = "none";
                document.getElementById('authBox').style.display = "none";
                document.body.classList.remove('yellow-alert', 'red-alert');
                logActivity("DOWNLOAD_ACCESS_GRANTED", "পাসওয়ার্ড ২ দিয়ে ফুল ডাউনলোড এক্সেস লাভ করেছে।");
                showFiles();
            }
            // 🟡 পাসওয়ার্ড ১ (ভিউ পাসওয়ার্ড) দিলে: হালকা অস্পষ্ট ওয়াটারমার্ক ভিউ (ডাউনলোড বাটন থাকবে না)
            else if (inputPass === viewPass) {
                isDownloadMode = false;
                errorMsg.style.display = "none";
                document.getElementById('authBox').style.display = "none";
                document.body.classList.remove('yellow-alert', 'red-alert');
                logActivity("VIEW_ONLY_GRANTED", "পাসওয়ার্ড ১ দিয়ে কেবল ভিউ এক্সেস লাভ করেছে।");
                showFiles();
            } 
            else {
                wrongAttempts++;
                logActivity("WRONG_PASSWORD", `ভুল পাসওয়ার্ড টাইপ করা হয়েছে (চেষ্টা নম্বর ${wrongAttempts}): '${inputPass}'`);

                if (wrongAttempts === 1) {
                    playSingleBeep();
                    startTimer(15, 1);
                } 
                else if (wrongAttempts === 2) {
                    document.body.classList.add('yellow-alert');
                    playDoubleBeep();
                    startTimer(30, 2);
                } 
                else if (wrongAttempts === 3) {
                    document.body.classList.remove('yellow-alert');
                    document.body.classList.add('red-alert');
                    playLaughSoundAndVibrate();
                    startTimer(60, 3);
                } 
                else if (wrongAttempts >= 4) {
                    document.body.classList.remove('yellow-alert');
                    document.body.classList.add('red-alert');
                    startContinuousVibration();
                    
                    document.getElementById('authBox').innerHTML = `
                        <div style="background: rgba(239, 68, 68, 0.3); padding: 20px; border-radius: 12px; border: 2px solid #ef4444;">
                            <h3 style="color:#ffffff;">🚨 এক্সেস ব্লক করা হয়েছে!</h3>
                            <p style="font-size: 14px; color: #fecdd3; margin-top: 10px;">
                                ৪বার ভুল পাসওয়ার্ড দিয়েছেন। ৩ দিনের জন্য আইপি সম্পূর্ণ ব্লক করা হলো।
                            </p>
                        </div>
                    `;

                    await blockUserFor3Days();

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 3000);
                }
            }
        });

        function startTimer(seconds, errorType) {
            const passcodeElement = document.getElementById('customerPasscode');
            const verifyBtn = document.getElementById('verifyBtn');
            const errorMsg = document.getElementById('errorMsg');

            passcodeElement.disabled = true; verifyBtn.disabled = true;
            let timeLeft = seconds;
            errorMsg.style.display = "block";

            timerInterval = setInterval(() => {
                if (errorType === 3) {
                    errorMsg.innerText = `🚨 এক্সেস ব্লক সতর্কতা! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                    if (timeLeft % 5 === 0) playLaughSoundAndVibrate();
                } else if (errorType === 2) {
                    errorMsg.innerText = `⚠️ ডাবল ভুল! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                    if (timeLeft % 3 === 0) playDoubleBeep();
                } else {
                    errorMsg.innerText = `❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                    if (timeLeft % 3 === 0) playSingleBeep();
                }

                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    passcodeElement.disabled = false; verifyBtn.disabled = false;
                    errorMsg.style.display = "none"; passcodeElement.value = ""; passcodeElement.focus();
                }
            }, 1000);
        }

        // ফাইলসমূহ প্রদর্শন করা
        function showFiles() {
            const docBox = document.getElementById('documentBox');
            const fileContainer = document.getElementById('fileContainer');
            document.getElementById('docTitle').innerText = currentDocumentData.file_name || 'ডকুমেন্ট ফাইলসমূহ';
            fileContainer.innerHTML = "";

            let fileList = [];
            try {
                fileList = JSON.parse(currentDocumentData.file_path);
                if (!Array.isArray(fileList)) fileList = [currentDocumentData.file_path];
            } catch(e) {
                fileList = [currentDocumentData.file_path];
            }

            fileList.forEach((filePath, index) => {
                const { data: urlData } = supabaseClient.storage.from('documents').getPublicUrl(filePath);
                const fileUrl = urlData.publicUrl;
                const ext = filePath.split('.').pop().toLowerCase();

                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';

                let previewHtml = '';
                
                // 🟢 ছোট ছোট ৩-৪ লাইনের কাস্টম টেক্সট ব্লক তৈরি
                const textUnit = `
                    <div class="watermark-item">
                        🔒UNAUTHORIZED COPYING<br>
                    </div>`;

                // 🟢 পুরো পিকচারের ১২ জায়গায় লেখা ছড়িয়ে দেওয়া (Grid pattern)
                const fullPageOverlay = `
                    <div class="watermark-overlay">
                        ${textUnit.repeat(12)}
                    </div>`;

                // পাসওয়ার্ড ১-এ হালকা ব্লার + পুরো পেজে ছোট অস্পষ্ট ওয়াটারমার্ক, পাসওয়ার্ড ২-এ ওয়াটারমার্ক আউট ও ১০০% ক্লিয়ার
                const previewClass = isDownloadMode ? '' : 'file-preview-restricted';
                const watermarkHtml = isDownloadMode ? '' : fullPageOverlay;

                if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                    previewHtml = `
                        <div class="file-preview">
                            ${watermarkHtml}
                            <img src="${fileUrl}" class="${previewClass}" alt="Preview">
                        </div>`;
                } else if (ext === 'pdf') {
                    previewHtml = `
                        <div class="file-preview">
                            ${watermarkHtml}
                            <iframe src="${fileUrl}" class="${previewClass}"></iframe>
                        </div>`;
                } else {
                    previewHtml = `<p style="margin-bottom:10px; font-size:13px;">ফাইল #${index+1} (ভিউ ফরম্যাট সাপোর্টেড নয়)</p>`;
                }

                const downloadBtnHtml = isDownloadMode 
                    ? `<button class="download-btn" onclick="triggerProtectedDownload('${fileUrl}')">📥 ফাইল #${index+1} ডাউনলোড করুন</button>`
                    : `<p style="color:#f87171; font-size:12px; margin-top:5px;">⚠️ কেবল দেখার অনুমতি রয়েছে। ডাউনলোড করতে পাসওয়ার্ড ২ দিয়ে প্রবেশ করুন।</p>`;

                fileDiv.innerHTML = `
                    ${previewHtml}
                    ${downloadBtnHtml}
                `;
                fileContainer.appendChild(fileDiv);
            });

            docBox.style.display = "block";
        }

        function triggerProtectedDownload(fileUrl) {
            if (!isDownloadMode) {
                alert("❌ আপনার কেবল দেখার অনুমতি রয়েছে। ফাইলটি ডাউনলোড করতে পাসওয়ার্ড ২ দিয়ে প্রবেশ করুন।");
                return;
            }
            logActivity("DOWNLOAD_SUCCESS", "ফাইল ডাউনলোড করা হয়েছে।");
            const a = document.createElement('a');
            a.href = fileUrl;
            a.download = '';
            a.target = '_blank';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.addEventListener('DOMContentLoaded', loadDocumentInfo);
    </script>
</body>
</html>
