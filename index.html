<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Vault</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>🔐 Secure Document Vault</h1>
        <p>আপনার ব্যক্তিগত ডকুমেন্ট নিরাপদে সংরক্ষিত</p>
    </div>

    <div class="card">

        <h2 id="folderTitle">লোড হচ্ছে...</h2>

        <div id="lockScreen">

            <input
                type="password"
                id="passInput"
                placeholder="পাসওয়ার্ড লিখুন">

            <button onclick="unlockFolder()">
                Unlock Folder
            </button>

        </div>

        <div id="secretContent" style="display:none;">

            <h3>📂 আপনার ফাইলসমূহ</h3>

            <div id="folderDetails"></div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
/script>
<script src="script.js"></script>
</body>
</html>
