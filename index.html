<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault - ফাইল ভিউয়ার</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .vault-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        input[type="password"] { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
        #fileViewerContainer { margin-top: 20px; display: none; }
        .file-preview { max-width: 100%; max-height: 350px; border-radius: 5px; margin-top: 10px; border: 1px solid #ddd; }
        .error-msg { color: red; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="vault-card">
        <h2>🔐 সিকিউর ফাইল ভিউয়ার</h2>
        <p id="fileTitleText" style="color: #666; font-size: 14px;">ফাইল দেখতে পাসওয়ার্ড দিন</p>

        <!-- পাসওয়ার্ড দেওয়ার ফর্ম -->
        <div id="authBox">
            <input type="password" id="accessPassword" placeholder="সিক্রেট পাসওয়ার্ড লিখুন" required>
            <button id="verifyBtn" onclick="verifyAndLoadFile()">ফাইল আনলক করুন</button>
            <p id="errorText" class="error-msg"></p>
        </div>

        <!-- ফাইল শো করার কন্টেইনার -->
        <div id="fileViewerContainer">
            <h3 id="displayFileName" style="color: #333; margin-bottom: 10px;"></h3>
            <div id="mediaBox"></div>
            <br>
            <a id="downloadBtn" href="#" target="_blank" style="display: inline-block; margin-top: 15px; background: #007bff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">📥 ফাইল ডাউনলোড করুন</a>
        </div>
    </div>

    <!-- 1. Config First -->
    <script src="config.js"></script>

    <!-- 2. Logic -->
    <script>
        let supabaseClient = null;
        let fileRecord = null;
        let fileParam = null;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        // URL থেকে ফাইল পাথ বা আইডি বের করা
        window.addEventListener('DOMContentLoaded', async () => {
            initSupabase();
            if (!supabaseClient) {
                document.getElementById('errorText').innerText = "⚠️ Supabase কনফিগারেশন লোড হয়নি!";
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            fileParam = urlParams.get('file'); // যেমন: uniqueFileName

            if (!fileParam) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('fileTitleText').innerText = "❌ কোনো ফাইল সিলেক্ট করা হয়নি বা লিংক ভুল!";
                document.getElementById('fileTitleText').style.color = "red";
                return;
            }

            // ডাটাবেজ থেকে এই ফাইলের ইনফো ফেচ করা
            const { data, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('file_path', fileParam)
                .single();

            if (error || !data) {
                document.getElementById('errorText').innerText = "❌ ফাইলটি ডাটাবেজে পাওয়া যায়নি!";
                return;
            }

            fileRecord = data;
            document.getElementById('fileTitleText').innerText = `ডকুমেন্ট: ${fileRecord.file_name}`;
        });

        // পাসওয়ার্ড যাচাই করে ফাইল ওপেন করার ফাংশন
        async function verifyAndLoadFile() {
            const enteredPassword = document.getElementById('accessPassword').value.trim();
            const errorText = document.getElementById('errorText');
            errorText.innerText = "";

            if (!enteredPassword) {
                errorText.innerText = "⚠️ দয়া করে পাসওয়ার্ড দিন!";
                return;
            }

            if (!fileRecord) {
                errorText.innerText = "⚠️ ফাইলের তথ্য লোড হয়নি!";
                return;
            }

            // ডাটাবেজের পাসওয়ার্ডের সাথে ইউজারের দেওয়া পাসওয়ার্ড মেলানো
            if (enteredPassword === fileRecord.passcode) {
                // পাসওয়ার্ড সঠিক! এখন স্টোরেজ থেকে পাবলিক বা সাইনড ইউআরএল আনব
                const { data: urlData } = supabaseClient
                    .storage
                    .from('vault-bucket')
                    .getPublicUrl(fileRecord.file_path);

                const fileUrl = urlData.publicUrl;

                // ইউজার ইন্টারফেস পরিবর্তন
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('fileTitleText').style.display = 'none';
                document.getElementById('fileViewerContainer').style.display = 'block';
                document.getElementById('displayFileName').innerText = fileRecord.file_name;

                // ফাইল যদি ছবি হয় বা অন্য কিছু হয় সেভাবে প্রিভিউ দেখানো
                const mediaBox = document.getElementById('mediaBox');
                const fileExt = fileRecord.file_path.split('.').pop().toLowerCase();
                
                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExt)) {
                    mediaBox.innerHTML = `<img src="${fileUrl}" class="file-preview" alt="Vault Image">`;
                } else if (fileExt === 'pdf') {
                    mediaBox.innerHTML = `<iframe src="${fileUrl}" width="100%" height="300px" style="border:none;"></iframe>`;
                } else {
                    mediaBox.innerHTML = `<p>এই ফাইলটি সরাসরি প্রিভিউ করা যাচ্ছে না, নিচের বাটন থেকে ডাউনলোড করুন।</p>`;
                }

                // ডাউনলোড বাটন সেটআপ
                document.getElementById('downloadBtn').href = fileUrl;

            } else {
                errorText.innerText = "❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।";
            }
        }
    </script>
</body>
</html>
