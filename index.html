<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Document Viewer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h2>🔒 ডকুমেন্ট ভিউয়ার</h2>
        <p style="font-size: 13px; color: #666;">ফাইলের গোপনীয়তা রক্ষার্থে সঠিক পাসওয়ার্ড প্রবেশ করান</p>

        <!-- পাসওয়ার্ড ইনপুট ফর্ম -->
        <div id="authBox">
            <input type="password" id="customerPasscode" placeholder="সিক্রেট পাসওয়ার্ড লিখুন"><br><br>
            <button id="verifyBtn">ডকুমেন্ট খুলুন</button>
            <p id="errorMsg" style="color: red; margin-top: 10px; display: none;"></p>
        </div>

        <!-- ফাইল দেখানোর স্থান -->
        <div id="documentBox" style="display: none; margin-top: 20px;">
            <h3 id="docTitle"></h3>
            <div id="fileViewer"></div>
        </div>
    </div>

    <!-- 1. Config -->
    <script src="config.js"></script>

    <!-- 2. Logic Script -->
    <script>
        let supabaseClient = null;
        let currentDocumentData = null;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        // URL থেকে File Parameter বের করার ফাংশন
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // ফাইল সংক্রান্ত তথ্য লোড করা
        async function loadDocumentInfo() {
            initSupabase();
            const filePath = getQueryParam('file');

            if (!filePath) {
                document.getElementById('authBox').innerHTML = '<p style="color:red;">❌ কোনো ফাইলের লিংক পাওয়া যায়নি!</p>';
                return;
            }

            if (!supabaseClient) {
                alert('Supabase Config সঠিক নয়!');
                return;
            }

            // ডাটাবেজ থেকে পাসওয়ার্ড সহ সব তথ্য লোড করা (* দিয়ে পাসওয়ার্ড সিলেক্ট করা হয়েছে)
            const { data, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('file_path', filePath)
                .single();

            if (error || !data) {
                console.error('Fetch Error:', error);
                document.getElementById('authBox').innerHTML = '<p style="color:red;">❌ ফাইলটি ডাটাবেজে পাওয়া যায়নি বা মুছে ফেলা হয়েছে!</p>';
                return;
            }

            currentDocumentData = data;
        }

        // পাসওয়ার্ড যাচাই করার লজিক
        document.getElementById('verifyBtn').addEventListener('click', () => {
            const inputPass = document.getElementById('customerPasscode').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!currentDocumentData) {
                errorMsg.innerText = "❌ ফাইলের তথ্য লোড হতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।";
                errorMsg.style.display = "block";
                return;
            }

            // পাসওয়ার্ড মেলানো (String এ রূপান্তর ও স্পেস রিমুভ করে)
            const correctPass = String(currentDocumentData.password).trim();

            if (inputPass === correctPass) {
                errorMsg.style.display = "none";
                document.getElementById('authBox').style.display = "none";
                showFile();
            } else {
                errorMsg.innerText = "❌ ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিয়ে আবার চেষ্টা করুন।";
                errorMsg.style.display = "block";
            }
        });

        // ফাইল দেখানোর ফাংশন
        function showFile() {
            const { data: urlData } = supabaseClient
                .storage
                .from('documents')
                .getPublicUrl(currentDocumentData.file_path);

            const fileUrl = urlData.publicUrl;
            const docBox = document.getElementById('documentBox');
            const fileViewer = document.getElementById('fileViewer');

            document.getElementById('docTitle').innerText = currentDocumentData.file_name || 'ডকুমেন্ট';

            const ext = currentDocumentData.file_path.split('.').pop().toLowerCase();

            if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                fileViewer.innerHTML = `<img src="${fileUrl}" style="max-width:100%; height:auto; border-radius:8px; border:1px solid #ccc;">`;
            } else if (ext === 'pdf') {
                fileViewer.innerHTML = `<iframe src="${fileUrl}" width="100%" height="500px" style="border:none;"></iframe>`;
            } else {
                fileViewer.innerHTML = `<a href="${fileUrl}" target="_blank" style="display:inline-block; padding:10px 15px; background:#0066cc; color:white; text-decoration:none; border-radius:5px;">📥 ফাইলটি ডাউনলোড করুন</a>`;
            }

            docBox.style.display = "block";
        }

        // পেজ লোড হলে
        window.addEventListener('DOMContentLoaded', loadDocumentInfo);
    </script>
</body>
</html>
