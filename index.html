<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SecureDocumentVault</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <div class="container">

    <h1>🔐 SecureDocumentVault</h1>

    <!-- Password Lock -->
    <div id="lockBox">

      <h2>Enter Password</h2>

      <input 
        type="password" 
        id="passInput" 
        placeholder="Password লিখুন">

      <button id="unlockBtn">
        Unlock
      </button>

      <p id="errorMsg"></p>

    </div>


    <!-- Main Vault Content -->
    <div id="vaultContent" style="display:none;">

      <h2 id="folderTitle">
        My Secure Files
      </h2>


      <!-- Upload Section -->
      <div class="uploadBox">

        <input 
          type="file" 
          id="fileInput">

        <button id="uploadBtn">
          Upload File
        </button>

      </div>


      <hr>


      <!-- File List -->
      <h3>
        Your Documents
      </h3>

      <div id="fileList">

        Loading files...

      </div>


    </div>


  </div>


<script src="script.js"></script>

</body>
</html>
