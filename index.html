<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সিকিউর ফাইল ভল্ট</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <h2>🔐 সিকিউর ফাইল ভল্ট</h2>
        <p>ফাইলটি দেখতে সিক্রেট পাসওয়ার্ডটি লিখুন:</p>

        <form onsubmit="return false;">
            <input type="password" id="passcodeInput" placeholder="পাসওয়ার্ড লিখুন...">
            <button type="button" id="submitBtn">পাসওয়ার্ড যাচাই করুন</button>
        </form>

        <div id="fileContainer" style="display: none; margin-top: 20px;">
            <div id="previewArea"></div>
            <br>
            <a id="downloadLink" href="#" class="btn-download" download>ফাইল ডাউনলোড করুন</a>
        </div>
    </div>

    <!-- JS Files Loading Sequence -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
