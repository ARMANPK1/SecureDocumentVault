<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Document Viewer</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .vault-icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }

        h2 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        input[type="password"]:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            border-color: rgba(239, 68, 68, 0.4);
        }

        input[type="password"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            background: rgba(15, 23, 42, 0.8);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        button:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
        }

        #errorMsg {
            color: #f87171;
            font-size: 13px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: none;
        }

        #documentBox {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        #docTitle {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .file-preview {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            max-height: 500px;
        }

        .file-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .file-preview iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #22c55e;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: #16a34a;
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="vault-icon">🔒</div>
        <h2>Secure Document Vault</h2>
        <p class="subtitle">ফাইলের গোপনীয়তা রক্ষার্থে সঠিক পাসওয়ার্ড দিন</p>

        <!-- পাসওয়ার্ড ইনপুট ফর্ম -->
        <div id="authBox">
            <div class="input-group">
                <input type="password" id="customerPasscode" placeholder="সিক্রেট পাসওয়ার্ড লিখুন">
            </div>
            <button id="verifyBtn">ডকুমেন্ট দেখুন</button>
            <p id="errorMsg"></p>
        </div>

        <!-- ফাইল দেখানোর স্থান -->
        <div id="documentBox" style="display: none;">
            <h3 id="docTitle"></h3>
            <div id="fileViewer" class="file-preview"></div>
        </div>
    </div>

    <!-- 1. Config -->
    <script src="config.js"></script>

    <!-- 2. Logic Script -->
    <script>
        let supabaseClient = null;
        let currentDocumentData = null;
        let wrongAttempts = 0; // ভুল ট্রাই গণনার জন্য
        let timerInterval = null; // টাইমার ক্লিয়ার করার জন্য

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadDocumentInfo() {
            initSupabase();
            const filePath = getQueryParam('file');

            if (!filePath) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ কোনো ফাইলের লিংক পাওয়া যায়নি!</p>';
                return;
            }

            if (!supabaseClient) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">⚠️ Supabase কনফিগারেশন মিসিং!</p>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('file_path', filePath)
                .single();

            if (error || !data) {
                console.error('Fetch Error:', error);
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ ফাইলটি ডাটাবেজে পাওয়া যায়নি!</p>';
                return;
            }

            currentDocumentData = data;
        }

        // পাসওয়ার্ড যাচাই ও টাইমার সিকিউরিটি লজিক
        document.getElementById('verifyBtn').addEventListener('click', () => {
            const passcodeElement = document.getElementById('customerPasscode');
            const verifyBtn = document.getElementById('verifyBtn');
            const errorMsg = document.getElementById('errorMsg');

            const inputPass = passcodeElement.value.trim();

            if (!currentDocumentData) {
                errorMsg.innerText = "❌ ফাইলের তথ্য লোড হতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।";
                errorMsg.style.display = "block";
                return;
            }

            const correctPass = String(currentDocumentData.password).trim();

            if (inputPass === correctPass) {
                errorMsg.style.display = "none";
                document.getElementById('authBox').style.display = "none";
                showFile();
            } else {
                wrongAttempts++;

                if (wrongAttempts === 1) {
                    startTimer(60); // ১ম ভুল: ১ মিনিট (৬০ সেকেন্ড)
                } else if (wrongAttempts === 2) {
                    startTimer(30); // ২য় ভুল: ৩০ সেকেন্ড
                } else if (wrongAttempts === 3) {
                    startTimer(15); // ৩য় ভুল: ১৫ সেকেন্ড
                } else if (wrongAttempts >= 4) {
                    // ৪থ ভুল: সাইট থেকে বের করে দেওয়া
                    errorMsg.innerText = "🚨 আপনি বহুবার ভুল পাসওয়ার্ড দিয়েছেন! আপনাকে মূল পেজে পাঠানো হচ্ছে...";
                    errorMsg.style.display = "block";
                    passcodeElement.disabled = true;
                    verifyBtn.disabled = true;

                    setTimeout(() => {
                        window.location.href = "index.html"; // মূল হোম পেজে রিডাইরেক্ট
                    }, 2000);
                }
            }
        });

        // কাউন্টডাউন টাইমার জেনারেট করার ফাংশন
        function startTimer(seconds) {
            const passcodeElement = document.getElementById('customerPasscode');
            const verifyBtn = document.getElementById('verifyBtn');
            const errorMsg = document.getElementById('errorMsg');

            passcodeElement.disabled = true;
            verifyBtn.disabled = true;
            let timeLeft = seconds;

            errorMsg.style.display = "block";

            timerInterval = setInterval(() => {
                errorMsg.innerText = `❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    passcodeElement.disabled = false;
                    verifyBtn.disabled = false;
                    errorMsg.style.display = "none";
                    passcodeElement.value = "";
                    passcodeElement.focus();
                }
            }, 1000);
        }

        function showFile() {
            const { data: urlData } = supabaseClient
                .storage
                .from('documents')
                .getPublicUrl(currentDocumentData.file_path);

            const fileUrl = urlData.publicUrl;
            const docBox = document.getElementById('documentBox');
            const fileViewer = document.getElementById('fileViewer');

            document.getElementById('docTitle').innerText = currentDocumentData.file_name || 'ডকুমেন্ট';

            const ext = currentDocumentData.file_path.split('.').pop().toLowerCase();

            if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                fileViewer.innerHTML = `<img src="${fileUrl}" alt="Document Preview">`;
            } else if (ext === 'pdf') {
                fileViewer.innerHTML = `<iframe src="${fileUrl}"></iframe>`;
            } else {
                fileViewer.innerHTML = `<div style="padding:20px;"><p style="margin-bottom:10px;">এই ফাইলটি সরাসরি ব্রাউজারে দেখা যাবে না।</p><a href="${fileUrl}" target="_blank" class="download-btn">📥 ফাইলটি ডাউনলোড করুন</a></div>`;
            }

            docBox.style.display = "block";
        }

        window.addEventListener('DOMContentLoaded', loadDocumentInfo);
    </script>
</body>
</html>
