<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Document Access</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="container">
    <div class="header">
      <img src="assets/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
      <h1>🔐 Secure Document Access</h1>
      <p>ফাইল দেখতে পাসওয়ার্ড প্রদান করুন</p>
    </div>

    <!-- Password Lock Box -->
    <div id="lockBox">
      <h2>Enter Passcode</h2>
      <input 
        type="password" 
        id="passInput" 
        placeholder="Password লিখুন"
        autocomplete="off">

      <button id="unlockBtn">
        Unlock
      </button>

      <p id="errorMsg"></p>
    </div>

    <!-- Main Vault Content (স্ক্যান করার পর প্রিভিউ ও ডাউনলোড) -->
    <div id="vaultContent" style="display:none;">
      <h2 id="docTitle">Document Preview</h2>

      <!-- PDF / Image Preview -->
      <div class="previewBox" style="margin: 20px 0;">
        <iframe id="docPreview" src="" style="width:100%; height:300px; border:1px solid #ccc; border-radius:8px;"></iframe>
      </div>

      <!-- Download Button -->
      <a id="downloadBtn" class="btn" download target="_blank" style="display:inline-block; padding:10px 20px; background:#28a745; color:#fff; text-decoration:none; border-radius:5px;">
        📥 ফাইল ডাউনলোড করুন
      </a>
    </div>
  </div>

  <!-- Config & JS File -->
  <script src="config.js"></script>
  <script src="script.js"></script>

</body>
</html>
