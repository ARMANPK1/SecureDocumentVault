<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Document Viewer</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* টেক্সট বা ফাইল সিলেকশন বন্ধ */
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        body.red-alert {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #450a0a 100%) !important;
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(1deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* সিকিউরিটি ব্লকিং লেয়ার (ট্যাব সুইচ বা নজর সরালে দেখাবে) */
        #securityOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98);
            z-index: 99999;
            color: #ef4444;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .vault-icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.5));
        }

        h2 { font-size: 24px; color: #ffffff; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 13px; color: #cbd5e1; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }

        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        input[type="password"]:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            border-color: rgba(239, 68, 68, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        button:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }

        #errorMsg {
            color: #f87171; font-size: 13px; margin-top: 15px; padding: 10px;
            background: rgba(239, 68, 68, 0.1); border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2); display: none;
        }

        #documentBox {
            margin-top: 25px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;
        }

        .file-item {
            background: rgba(0, 0, 0, 0.3); border-radius: 12px;
            padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .file-preview { border-radius: 8px; overflow: hidden; max-height: 400px; margin-bottom: 10px; }
        .file-preview img { width: 100%; height: auto; pointer-events: none; }
        .file-preview iframe { width: 100%; height: 350px; border: none; }

        .download-btn {
            display: inline-block; padding: 10px 20px; background: #22c55e;
            color: #ffffff; text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 14px; cursor: pointer; border: none;
        }

        .download-btn:hover { background: #16a34a; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- সিকিউরিটি স্ক্রিন প্রোটেকশন অ্যালার্ট -->
    <div id="securityOverlay">
        🔒 সিকিউরিটি সতর্কতা!
        <span style="font-size: 14px; color: #cbd5e1; margin-top: 10px;">ব্রাউজার ফোকাস হারিয়েছে বা স্ক্রিন রেকর্ড করার চেষ্টা করা হয়েছে!</span>
    </div>

    <div class="container">
        <div class="vault-icon">🔒</div>
        <h2>Secure Document Vault</h2>
        <p class="subtitle">ফাইলের গোপনীয়তা রক্ষার্থে সঠিক পাসওয়ার্ড দিন</p>

        <!-- পাসওয়ার্ড ইনপুট ফর্ম -->
        <div id="authBox">
            <div class="input-group">
                <input type="password" id="customerPasscode" placeholder="সিক্রেট পাসওয়ার্ড লিখুন">
            </div>
            <button id="verifyBtn">ডকুমেন্ট দেখুন</button>
            <p id="errorMsg"></p>
        </div>

        <!-- ফাইল দেখানোর স্থান -->
        <div id="documentBox" style="display: none;">
            <h3 id="docTitle" style="margin-bottom: 15px; color: #a855f7;"></h3>
            <div id="fileContainer"></div>
        </div>
    </div>

    <!-- 1. Config -->
    <script src="config.js"></script>

    <!-- 2. Logic Script -->
    <script>
        let supabaseClient = null;
        let currentDocumentData = null;
        let wrongAttempts = 0;
        let timerInterval = null;
        let userIP = "Unknown";
        let userLocation = "Unknown";

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // ইউজার IP ও লোকেশন ট্র্যাকিং
        async function fetchUserIP() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                userIP = data.ip || "Unknown";
                userLocation = `${data.city || ''}, ${data.country_name || ''}`;
            } catch (err) {
                try {
                    const fallback = await fetch('https://api.ipify.org?format=json');
                    const fbData = await fallback.json();
                    userIP = fbData.ip;
                } catch(e){}
            }
        }

        // অ্যাডমিন প্যানেলে দেখার জন্য ডাটাবেজে অ্যাক্টিভিটি লগ সেভ করা
        async function logActivity(actionType, details) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('audit_logs').insert([
                    {
                        ip_address: userIP,
                        location: userLocation,
                        file_name: currentDocumentData ? currentDocumentData.file_name : 'Unknown',
                        action: actionType,
                        details: details,
                        created_at: new Date()
                    }
                ]);
            } catch(e) { console.error("Logging failed", e); }
        }

        async function checkIPBlockStatus() {
            if (!userIP || !supabaseClient) return false;
            try {
                const { data } = await supabaseClient
                    .from('blocked_ips')
                    .select('*')
                    .eq('ip_address', userIP)
                    .single();

                if (data) {
                    const unblockTime = new Date(data.blocked_until);
                    if (new Date() < unblockTime) {
                        document.getElementById('authBox').innerHTML = `
                            <div style="background: rgba(239, 68, 68, 0.2); padding: 15px; border-radius: 12px; border: 1px solid #ef4444;">
                                <h4 style="color:#f87171;">🚫 এক্সেস সম্পূর্ণ ব্লক করা হয়েছে!</h4>
                                <p style="font-size: 13px; color: #cbd5e1; margin-top: 8px;">
                                    সন্দেহজনক কার্যক্রম বা অতিরিক্ত ভুল পাসওয়ার্ডের কারণে অ্যাডমিন প্যানেল থেকে আপনার আইপি ব্লক করা হয়েছে।
                                </p>
                            </div>
                        `;
                        return true;
                    }
                }
            } catch(e){}
            return false;
        }

        async function loadDocumentInfo() {
            initSupabase();
            await fetchUserIP();

            const isBlocked = await checkIPBlockStatus();
            if (isBlocked) return;

            const filePath = getQueryParam('file');
            if (!filePath) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ কোনো ফাইলের লিংক পাওয়া যায়নি!</p>';
                return;
            }

            if (!supabaseClient) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">⚠️ Supabase কনফিগারেশন মিসিং!</p>';
                return;
            }

            const { data, error } = await supabaseClient
                .from('documents')
                .select('*')
                .eq('file_path', filePath)
                .single();

            if (error || !data) {
                document.getElementById('authBox').innerHTML = '<p style="color:#f87171;">❌ ফাইলটি ডাটাবেজে পাওয়া যায়নি!</p>';
                return;
            }

            currentDocumentData = data;
        }

        async function blockUserPermanently() {
            if (!userIP || !supabaseClient) return;
            const blockedUntil = new Date();
            blockedUntil.setFullYear(blockedUntil.getFullYear() + 99); // লাইফটাইম ব্লক

            await supabaseClient
                .from('blocked_ips')
                .upsert([{ ip_address: userIP, blocked_until: blockedUntil.toISOString() }]);
            
            logActivity("USER_BLOCKED", "অতিরিক্ত ভুল পাসওয়ার্ডের জন্য লাইফটাইম ব্লক করা হয়েছে।");
        }

        // --- সাউন্ড ও স্ক্রিন গার্ড ---
        function playSingleBeep() {
            try {
                if (navigator.vibrate) navigator.vibrate(100);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function playDoubleBeep() {
            try {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                playSingleBeep(); setTimeout(playSingleBeep, 200);
            } catch(e) {}
        }

        function playLaughSoundAndVibrate() {
            try {
                if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500, 200, 500]);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                let startTime = ctx.currentTime;
                let notes = [300, 450, 300, 450, 500, 350, 550];
                notes.forEach((freq, index) => {
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'triangle';
                    let noteTime = startTime + (index * 0.12);
                    osc.frequency.setValueAtTime(freq, noteTime);
                    gain.gain.setValueAtTime(0.3, noteTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, noteTime + 0.1);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(noteTime); osc.stop(noteTime + 0.12);
                });
            } catch(e) {}
        }

        // স্ক্রিনশট এবং ট্যাব ব্লকিং ডিটেকশন
        window.addEventListener('blur', () => {
            if (document.getElementById('documentBox').style.display === 'block') {
                document.getElementById('securityOverlay').style.display = 'flex';
            }
        });

        window.addEventListener('focus', () => {
            document.getElementById('securityOverlay').style.display = 'none';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'PrintScreen' || (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u'))) {
                e.preventDefault();
                alert('⚠️ সিকিউরিটি অ্যালার্ট: স্ক্রিনশট বা সেভ করা সম্পূর্ণ নিষেধ!');
                logActivity("SCREENSHOT_ATTEMPT", "স্ক্রিনশট বা পেজ সেভ করার চেষ্টা করেছে।");
            }
        });

        // পাসওয়ার্ড ভ্যালিডেশন
        document.getElementById('verifyBtn').addEventListener('click', async () => {
            const passcodeElement = document.getElementById('customerPasscode');
            const errorMsg = document.getElementById('errorMsg');
            const inputPass = passcodeElement.value.trim();

            if (!currentDocumentData) {
                errorMsg.innerText = "❌ ফাইলের তথ্য লোড হতে সমস্যা হয়েছে। পেজ রিফ্রেশ করুন।";
                errorMsg.style.display = "block";
                return;
            }

            const correctPass = String(currentDocumentData.passcode || currentDocumentData.password).trim();

            if (inputPass === correctPass) {
                errorMsg.style.display = "none";
                document.getElementById('authBox').style.display = "none";
                logActivity("VIEW_SUCCESS", "সঠিক ভিউ পাসওয়ার্ড দিয়ে ফাইল উন্মোচন করা হয়েছে।");
                showFiles();
            } else {
                wrongAttempts++;
                logActivity("WRONG_PASSWORD", `ভুল ভিউ পাসওয়ার্ড টাইপ করা হয়েছে: '${inputPass}'`);

                if (wrongAttempts === 1) {
                    playSingleBeep(); startTimer(15, 1);
                } else if (wrongAttempts === 2) {
                    playDoubleBeep(); startTimer(30, 2);
                } else if (wrongAttempts >= 3) {
                    document.body.classList.add('red-alert');
                    playLaughSoundAndVibrate();
                    await blockUserPermanently();
                    startTimer(60, 3);
                }
            }
        });

        function startTimer(seconds, errorType) {
            const passcodeElement = document.getElementById('customerPasscode');
            const verifyBtn = document.getElementById('verifyBtn');
            const errorMsg = document.getElementById('errorMsg');

            passcodeElement.disabled = true; verifyBtn.disabled = true;
            let timeLeft = seconds;
            errorMsg.style.display = "block";

            timerInterval = setInterval(() => {
                if (errorType === 3) {
                    errorMsg.innerText = `🚨 এক্সেস ব্লক! প্রস্তুত হোন, পেজ থেকে বের করে দেওয়া হচ্ছে: ${timeLeft} সেকেন্ড`;
                } else if (errorType === 2) {
                    errorMsg.innerText = `❌ ডাবল ভুল! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                    if (timeLeft % 3 === 0) playDoubleBeep();
                } else {
                    errorMsg.innerText = `❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করতে অপেক্ষা করুন: ${timeLeft} সেকেন্ড`;
                    if (timeLeft % 3 === 0) playSingleBeep();
                }

                timeLeft--;
                if (timeLeft < 0) {
                    clearInterval(timerInterval);
                    if (errorType === 3) {
                        window.location.href = "index.html";
                    } else {
                        passcodeElement.disabled = false; verifyBtn.disabled = false;
                        errorMsg.style.display = "none"; passcodeElement.value = ""; passcodeElement.focus();
                    }
                }
            }, 1000);
        }

        // ফাইলসমূহ প্রদর্শন করা
        function showFiles() {
            const docBox = document.getElementById('documentBox');
            const fileContainer = document.getElementById('fileContainer');
            document.getElementById('docTitle').innerText = currentDocumentData.file_name || 'ডকুমেন্ট ফাইলসমূহ';
            fileContainer.innerHTML = "";

            let fileList = [];
            try {
                fileList = JSON.parse(currentDocumentData.file_path);
                if (!Array.isArray(fileList)) fileList = [currentDocumentData.file_path];
            } catch(e) {
                fileList = [currentDocumentData.file_path];
            }

            fileList.forEach((filePath, index) => {
                const { data: urlData } = supabaseClient.storage.from('documents').getPublicUrl(filePath);
                const fileUrl = urlData.publicUrl;
                const ext = filePath.split('.').pop().toLowerCase();

                const fileDiv = document.createElement('div');
                fileDiv.className = 'file-item';

                let previewHtml = '';
                if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                    previewHtml = `<div class="file-preview"><img src="${fileUrl}" alt="Preview"></div>`;
                } else if (ext === 'pdf') {
                    previewHtml = `<div class="file-preview"><iframe src="${fileUrl}"></iframe></div>`;
                } else {
                    previewHtml = `<p style="margin-bottom:10px; font-size:13px;">ফাইল #${index+1} (ভিউ ফরম্যাট সাপোর্টেড নয়)</p>`;
                }

                fileDiv.innerHTML = `
                    ${previewHtml}
                    <button class="download-btn" onclick="triggerProtectedDownload('${fileUrl}')">📥 ফাইল #${index+1} ডাউনলোড করুন</button>
                `;
                fileContainer.appendChild(fileDiv);
            });

            docBox.style.display = "block";
        }

        // ২য় পাসওয়ার্ড (ডাউনলোড পাসওয়ার্ড) ভ্যালিডেশন
        function triggerProtectedDownload(fileUrl) {
            const enteredDownloadPass = prompt("🔐 ডাউনলোড কনফার্ম করতে ২য় ডাউনলোড পাসওয়ার্ডটি লিখুন:");
            if (!enteredDownloadPass) return;

            const correctDownloadPass = String(currentDocumentData.download_passcode).trim();

            if (enteredDownloadPass === correctDownloadPass) {
                logActivity("DOWNLOAD_SUCCESS", "সঠিক ২য় পাসওয়ার্ড দিয়ে ফাইল ডাউনলোড করা হয়েছে।");
                alert("🎉 ডাউনলোড পাসওয়ার্ড সঠিক! আপনার ডাউনলোড শুরু হচ্ছে...");
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = '';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                logActivity("WRONG_DOWNLOAD_PASSWORD", `ভুল ডাউনলোড পাসওয়ার্ড টাইপ করেছে: '${enteredDownloadPass}'`);
                alert("❌ ভুল ডাউনলোড পাসওয়ার্ড! ফাইল ডাউনলোড করা সম্ভব নয়।");
            }
        }

        window.addEventListener('DOMContentLoaded', loadDocumentInfo);
    </script>
</body>
</html>
