<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure QR Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 id="folderTitle">সুরক্ষিত ফোল্ডার</h1>
    <p>কন্টেন্ট দেখতে সঠিক পাসওয়ার্ড দিন</p>

    <!-- পাসওয়ার্ড ইনপুট বক্স -->
    <div id="lockScreen">
      <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন...">
      <button onclick="unlockFolder()">আনলক করুন</button>
    </div>

    <!-- গোপন তথ্য/ফাইল (শুরুতে লুকানো থাকবে) -->
    <div id="secretContent" style="display: none;">
      <h2>🎉 ফোল্ডার আনলক হয়েছে!</h2>
      <div id="folderDetails"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
