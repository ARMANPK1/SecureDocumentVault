<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Canvas Based QR Code Library for Overlay Logo Support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        #qrResult { margin-top: 20px; padding: 15px; border-top: 2px dashed #ccc; text-align: center; }
        #qrCanvas { display: block; margin: 15px auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

        /* Admin List Section Styling */
        .admin-section { margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px; }
        .refresh-btn { float: right; background-color: #0066cc; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .refresh-btn:hover { background-color: #0052a3; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        .vault-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        .vault-table th, .vault-table td { border: 1px solid #ddd; padding: 10px; font-size: 14px; }
        .vault-table th { background-color: #f4f4f4; }
        .action-btn { padding: 5px 8px; font-size: 12px; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; display: inline-block; margin: 2px; }
        .btn-view { background-color: #28a745; color: white; }
        .btn-qr { background-color: #17a2b8; color: white; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Secure Vault Admin</h2>
        <a href="index.html">User View</a>
        <h3>ফাইল আপলোড প্যানেল</h3>
        
        <form id="uploadForm" onsubmit="return false;">
            <input type="text" id="fileNameInput" placeholder="ডকুমেন্টের শিরোনাম/নাম" required><br><br>
            <input type="password" id="passcodeInput" placeholder="সিক্রেট পাসওয়ার্ড দিন" required><br><br>
            <input type="file" id="fileInput" required><br><br>
            <button type="button" id="uploadBtn">আপলোড করুন</button>
        </form>

        <!-- QR Code এবং Link দেখানোর বক্স -->
        <div id="qrResult" style="display: none;">
            <h4>🎉 ফাইল তৈরি সফল হয়েছে!</h4>
            <p style="font-size: 12px; color: #555;">ডাউনলোড লিংক:</p>
            <p id="fileLinkDisplay" style="word-break: break-all; color: #0066cc; font-weight: bold;"></p>
            <p style="margin-top: 10px;">QR Code:</p>
            
            <!-- কাস্টম লোগোসহ QR কোড ড্র করার ক্যানভাস -->
            <canvas id="qrCanvas"></canvas>
            <!-- হিডেন QR হোল্ডার -->
            <div id="qrcodeTemp" style="display:none;"></div>
        </div>

        <!-- 📂 আপলোডকৃত ফাইল দেখার লিস্ট -->
        <div class="admin-section">
            <button class="refresh-btn" onclick="fetchFiles()">🔄 রিফ্রেশ করুন</button>
            <h3>📂 আপলোডকৃত ফাইলের তালিকা</h3>
            
            <div class="table-responsive">
                <table class="vault-table">
                    <thead>
                        <tr>
                            <th>শিরোনাম</th>
                            <th>ফাইলের পাথ</th>
                            <th>পাসওয়ার্ড</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="fileListBody">
                        <tr>
                            <td colspan="4" style="text-align: center;">ডাটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 1. Config First -->
    <script src="config.js"></script>

    <!-- 2. Main Logic -->
    <script>
        let supabaseClient = null;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        // ১. ফাইল আপলোড লজিক
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            if (!supabaseClient) initSupabase();

            if (!supabaseClient) {
                alert('⚠️ Supabase বা Config (config.js) লোড হতে সমস্যা হয়েছে!');
                return;
            }
            
            const fileName = document.getElementById('fileNameInput').value.trim();
            const passcode = document.getElementById('passcodeInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file || !fileName || !passcode) {
                alert('⚠️ অনুগ্রহ করে সবগুলো ঘর পূরণ করুন!');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = 'আপলোড হচ্ছে...';
            uploadBtn.disabled = true;

            try {
                const fileExt = file.name.split('.').pop();
                const uniqueFileName = `${Date.now()}_${fileName}.${fileExt}`;

                // স্টোরেজ আপলোড
                const { data: storageData, error: storageError } = await supabaseClient
                    .storage
                    .from('documents') 
                    .upload(uniqueFileName, file);

                if (storageError) {
                    throw new Error('স্টোরেজ এরর: ' + storageError.message);
                }

                // ডাটাবেস ইনসার্ট
                const { data: dbData, error: dbError } = await supabaseClient
                    .from('documents')
                    .insert([
                        { 
                            file_name: fileName,
                            file_path: uniqueFileName, 
                            password: passcode
                        }
                    ]);

                if (dbError) {
                    throw new Error('ডাটাবেস এরর: ' + dbError.message);
                }

                alert('🎉 সফলভাবে ফাইল আপলোড ও সেভ হয়েছে!');

                // লোগোসহ QR তৈরি
                generateQRCode(uniqueFileName);

                document.getElementById('uploadForm').reset();
                fetchFiles();

            } catch (err) {
                alert('❌ ' + err.message);
                console.error(err);
            } finally {
                uploadBtn.innerText = 'আপলোড করুন';
                uploadBtn.disabled = false;
            }
        });

        // ২. অটোমেটিক সিকিউরিটি লোগোসহ QR Code জেনারেট করার ফাংশন
        function generateQRCode(filePath) {
            const accessUrl = `https://armanpk1.github.io/SecureDocumentVault/index.html?file=${encodeURIComponent(filePath)}`;
            document.getElementById('fileLinkDisplay').innerText = accessUrl;

            const tempContainer = document.getElementById('qrcodeTemp');
            tempContainer.innerHTML = "";

            // ক্যানভাস প্রস্তুত করা
            const mainCanvas = document.getElementById('qrCanvas');
            const ctx = mainCanvas.getContext('2d');
            const qrSize = 260;
            mainCanvas.width = qrSize;
            mainCanvas.height = qrSize;

            // QRCode.js দিয়ে High Error Correction লেভেলে QR তৈরি
            const qrcodeObj = new QRCode(tempContainer, {
                text: accessUrl,
                width: qrSize,
                height: qrSize,
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const baseCanvas = tempContainer.querySelector('canvas');
                if (!baseCanvas) return;

                // ১. মূল ক্যানভাসে QR কোড আঁকা
                ctx.drawImage(baseCanvas, 0, 0);

                // ২. আপনার পাঠানো পুলিশ/সিকিউরিটি আইকনের নিখুঁত SVG ডেটা
                const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="#000000" d="M256 0c-48.6 0-91.8 24.3-118 61.8L35 106.6C20.8 112 11.2 125.1 11.2 140.3c0 8.4 3 16.5 8.5 22.8l38.2 43.8c10.8 12.4 27.2 18.2 42.9 15.2l39.5-7.5c28 26.6 65.6 42.4 106.7 42.4s78.7-15.8 106.7-42.4l39.5 7.5c15.7 3 32.1-2.8 42.9-15.2l38.2-43.8c5.5-6.3 8.5-14.4 8.5-22.8 0-15.2-9.6-28.3-23.8-33.7l-103-44.8C347.8 24.3 304.6 0 256 0zm0 112c-44.2 0-80 35.8-80 80s35.8 80 80 80 80-35.8 80-80-35.8-80-80-80zm0 180c-88.4 0-160 53.7-160 120v40c0 11 9 20 20 20h280c11 0 20-9 20-20v-40c0-66.3-71.6-120-160-120z"/></svg>`;
                
                const blob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(blob);
                const logoImg = new Image();

                logoImg.onload = function() {
                    const logoSize = 52; // সেন্ট্রাল লোগোর সাইজ
                    const x = (qrSize - logoSize) / 2;
                    const y = (qrSize - logoSize) / 2;

                    // ৩. লোগোর পেছনে গোলাকার সাদা ব্যাকগ্রাউন্ড দেওয়া (যাতে QR স্ক্যান বিঘ্নিত না হয়)
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(qrSize / 2, qrSize / 2, (logoSize / 2) + 4, 0, Math.PI * 2);
                    ctx.fill();

                    // ৪. মাঝখানে পুলিশ আইকন ড্র করা
                    ctx.drawImage(logoImg, x, y, logoSize, logoSize);
                    URL.revokeObjectURL(url);
                };

                logoImg.src = url;
                document.getElementById('qrResult').style.display = 'block';
            }, 150);
        }

        // ৩. ডাটাবেজ থেকে ফাইল তালিকা লোড
        async function fetchFiles() {
            if (!supabaseClient) initSupabase();
            const tableBody = document.getElementById('fileListBody');

            if (!supabaseClient) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Supabase কনফিগারেশন মিসিং! (config.js চেক করুন)</td></tr>`;
                return;
            }

            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">ডাটা রিফ্রেশ হচ্ছে...</td></tr>`;

            const { data: documents, error } = await supabaseClient
                .from('documents')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">এরর: ${error.message}</td></tr>`;
                return;
            }

            if (!documents || documents.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">কোনো ফাইল পাওয়া যায়নি।</td></tr>`;
                return;
            }

            tableBody.innerHTML = "";
            documents.forEach(doc => {
                const { data: urlData } = supabaseClient
                    .storage
                    .from('documents')
                    .getPublicUrl(doc.file_path);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${doc.file_name || 'N/A'}</b></td>
                    <td style="font-size: 11px; font-family: monospace;">${doc.file_path}</td>
                    <td><code>${doc.password || 'N/A'}</code></td>
                    <td>
                        <a href="${urlData.publicUrl}" target="_blank" class="action-btn btn-view">👁️ দেখুন</a>
                        <button onclick="generateQRCode('${doc.file_path}')" class="action-btn btn-qr">📱 QR</button>
                        <button onclick="editPassword('${doc.id}', '${doc.password}')" class="action-btn btn-edit">✏️ পাসওয়ার্ড</button>
                        <button onclick="deleteFile('${doc.id}', '${doc.file_path}')" class="action-btn btn-delete">🗑️ ডিলিট</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // ৪. পাসওয়ার্ড পরিবর্তনের ফাংশন
        async function editPassword(id, oldPassword) {
            const newPassword = prompt("নতুন পাসওয়ার্ড লিখুন:", oldPassword);
            if (!newPassword || newPassword === oldPassword) return;

            if (!supabaseClient) initSupabase();

            const { error } = await supabaseClient
                .from('documents')
                .update({ password: newPassword })
                .eq('id', id);

            if (error) {
                alert("পাসওয়ার্ড আপডেট করতে সমস্যা: " + error.message);
            } else {
                alert("🎉 পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে!");
                fetchFiles();
            }
        }

        // ৫. ফাইল ডিলিট ফাংশন
        async function deleteFile(id, filePath) {
            if (!confirm("আপনি কি নিশ্চিত যে এই ফাইলটি মুছে ফেলতে চান?")) return;

            if (!supabaseClient) initSupabase();

            if (filePath) {
                await supabaseClient.storage.from('documents').remove([filePath]);
            }

            const { error } = await supabaseClient
                .from('documents')
                .delete()
                .eq('id', id);

            if (error) {
                alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
            } else {
                alert("ফাইলটি সফলভাবে ডিলিট করা হয়েছে!");
                fetchFiles();
            }
        }

        // পেজ লোড হলেই ডাটা লোড হবে
        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            fetchFiles();
        });
    </script>
</body>
</html>
