<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Vault Admin</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        #qrResult { margin-top: 20px; padding: 15px; border-top: 2px dashed #ccc; text-align: center; }
        #qrcode img { display: block; margin: 10px auto; }

        /* Admin List Section Styling */
        .admin-section { margin-top: 40px; border-top: 2px solid #ddd; padding-top: 20px; }
        .refresh-btn { float: right; background-color: #0066cc; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .refresh-btn:hover { background-color: #0052a3; }
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; }
        .vault-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 10px; }
        .vault-table th, .vault-table td { border: 1px solid #ddd; padding: 10px; font-size: 14px; }
        .vault-table th { background-color: #f4f4f4; }
        .action-btn { padding: 5px 10px; font-size: 12px; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-view { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Secure Vault Admin</h2>
        <a href="index.html">User View</a>
        <h3>ফাইল আপলোড প্যানেল</h3>
        
        <form id="uploadForm" onsubmit="return false;">
            <input type="text" id="fileNameInput" placeholder="ডকুমেন্টের শিরোনাম/নাম" required><br><br>
            <input type="password" id="passcodeInput" placeholder="সিক্রেট পাসওয়ার্ড দিন" required><br><br>
            <input type="file" id="fileInput" required><br><br>
            <button type="button" id="uploadBtn">আপলোড করুন</button>
        </form>

        <!-- QR Code এবং Link দেখানোর বক্স -->
        <div id="qrResult" style="display: none;">
            <h4>🎉 ফাইল তৈরি সফল হয়েছে!</h4>
            <p style="font-size: 12px; color: #555;">ডাউনলোড লিংক:</p>
            <p id="fileLinkDisplay" style="word-break: break-all; color: #0066cc; font-weight: bold;"></p>
            <p style="margin-top: 10px;">QR Code:</p>
            <div id="qrcode"></div>
        </div>

        <!-- 📂 নতুন যোগ করা হয়েছে: আপলোডকৃত ফাইল দেখার লিস্ট -->
        <div class="admin-section">
            <button class="refresh-btn" onclick="fetchFiles()">🔄 রিফ্রেশ করুন</button>
            <h3>📂 আপলোডকৃত ফাইলের তালিকা</h3>
            
            <div class="table-responsive">
                <table class="vault-table">
                    <thead>
                        <tr>
                            <th>শিরোনাম</th>
                            <th>ফাইলের পাথ</th>
                            <th>পাসওয়ার্ড</th>
                            <th>অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="fileListBody">
                        <tr>
                            <td colspan="4" style="text-align: center;">ডাটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 1. Config First -->
    <script src="config.js"></script>

    <!-- 2. QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <!-- 3. Upload, Dynamic QR Code & File Listing Logic -->
    <script>
        // Global Supabase Client Initialization
        let supabaseClient = null;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        // আপলোড লজিক
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            if (!supabaseClient) initSupabase();

            if (!supabaseClient) {
                alert('⚠️ Supabase বা Config লোড হতে সমস্যা হয়েছে!');
                return;
            }
            
            const fileName = document.getElementById('fileNameInput').value.trim();
            const passcode = document.getElementById('passcodeInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file || !fileName || !passcode) {
                alert('⚠️ অনুগ্রহ করে সবগুলো ঘর পূরণ করুন!');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = 'আপলোড হচ্ছে...';
            uploadBtn.disabled = true;

            try {
                const fileExt = file.name.split('.').pop();
                const uniqueFileName = `${Date.now()}_${fileName}.${fileExt}`;

                // ১. Storage Upload
                const { data: storageData, error: storageError } = await supabaseClient
                    .storage
                    .from('vault-bucket') 
                    .upload(uniqueFileName, file);

                if (storageError) {
                    throw new Error('স্টোরেজ এরর: ' + storageError.message);
                }

                // ২. Database Insert
                const { data: dbData, error: dbError } = await supabaseClient
    .from('documents')
    .insert([
        { 
            file_name: fileName,
            file_path: uniqueFileName, 
            passcode: passcode  // 👈 এখানে 'passcode' করে দিন
        }
    ]);

                if (dbError) {
                    throw new Error('ডাটাবেস এরর: ' + dbError.message);
                }

                alert('🎉 সফলভাবে ফাইল আপলোড ও সেভ হয়েছে!');

                // QR Code Display
                const accessUrl = `${window.location.origin}/index.html?file=${encodeURIComponent(uniqueFileName)}`;
                document.getElementById('fileLinkDisplay').innerText = accessUrl;
                
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = "";
                if (typeof qrcode !== 'undefined') {
                    const qr = qrcode(0, 'M');
                    qr.addData(accessUrl);
                    qr.make();
                    qrContainer.innerHTML = qr.createImgTag(5);
                }

                document.getElementById('qrResult').style.display = 'block';
                document.getElementById('uploadForm').reset();
                
                // লিস্ট আপডেট করুন
                fetchFiles();

            } catch (err) {
                alert('❌ ' + err.message);
                console.error(err);
            } finally {
                uploadBtn.innerText = 'আপলোড করুন';
                uploadBtn.disabled = false;
// Global Supabase Client Initialization
        let supabaseClient = null;

        function initSupabase() {
            if (typeof supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        }

        // ১. আপলোড লজিক (সঠিক Bucket ও Password সহ)
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            if (!supabaseClient) initSupabase();

            if (!supabaseClient) {
                alert('⚠️ Supabase বা Config লোড হতে সমস্যা হয়েছে!');
                return;
            }
            
            const fileName = document.getElementById('fileNameInput').value.trim();
            const passcode = document.getElementById('passcodeInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file || !fileName || !passcode) {
                alert('⚠️ অনুগ্রহ করে সবগুলো ঘর পূরণ করুন!');
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = 'আপলোড হচ্ছে...';
            uploadBtn.disabled = true;

            try {
                const fileExt = file.name.split('.').pop();
                const uniqueFileName = `${Date.now()}_${fileName}.${fileExt}`;

                // ১. Storage Upload ('documents' bucket)
                const { data: storageData, error: storageError } = await supabaseClient
                    .storage
                    .from('documents') 
                    .upload(uniqueFileName, file);

                if (storageError) {
                    throw new Error('স্টোরেজ এরর: ' + storageError.message);
                }

                // ২. Database Insert ('password' column)
                const { data: dbData, error: dbError } = await supabaseClient
                    .from('documents')
                    .insert([
                        { 
                            file_name: fileName,
                            file_path: uniqueFileName, 
                            password: passcode
                        }
                    ]);

                if (dbError) {
                    throw new Error('ডাটাবেস এরর: ' + dbError.message);
                }

                alert('🎉 সফলভাবে ফাইল আপলোড ও সেভ হয়েছে!');

                // ৩. সঠিক QR Code Link তৈরি
                generateQRCode(uniqueFileName);

                document.getElementById('uploadForm').reset();
                fetchFiles();

            } catch (err) {
                alert('❌ ' + err.message);
                console.error(err);
            } finally {
                uploadBtn.innerText = 'আপলোড করুন';
                uploadBtn.disabled = false;
            }
        });

        // QR Code তৈরির হেল্পার ফাংশন
        function generateQRCode(filePath) {
            const repoPath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            const accessUrl = `${window.location.origin}${repoPath}/index.html?file=${encodeURIComponent(filePath)}`;
            
            document.getElementById('fileLinkDisplay').innerText = accessUrl;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            if (typeof qrcode !== 'undefined') {
                const qr = qrcode(0, 'M');
                qr.addData(accessUrl);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(5);
            }

            document.getElementById('qrResult').style.display = 'block';
        }

        // 📂 ২. ডাটাবেজ থেকে ফাইল তালিকা ও পাসওয়ার্ড পরিবর্তনের অপশন লোড
        async function fetchFiles() {
            if (!supabaseClient) initSupabase();
            const tableBody = document.getElementById('fileListBody');

            if (!supabaseClient) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Supabase কনফিগারেশন মিসিং!</td></tr>`;
                return;
            }

            tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">ডাটা রিফ্রেশ হচ্ছে...</td></tr>`;

            const { data: documents, error } = await supabaseClient
                .from('documents')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">এরর: ${error.message}</td></tr>`;
                return;
            }

            if (documents.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center;">কোনো ফাইল পাওয়া যায়নি।</td></tr>`;
                return;
            }

            tableBody.innerHTML = "";
            documents.forEach(doc => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${doc.file_name || 'N/A'}</b></td>
                    <td style="font-size: 11px; font-family: monospace;">${doc.file_path}</td>
                    <td><code>${doc.password || 'N/A'}</code></td>
                    <td>
                        <button onclick="editPassword('${doc.id}', '${doc.password}')" class="action-btn" style="background:#ffc107; color:black;">✏️ পাসওয়ার্ড</button>
                        <button onclick="generateQRCode('${doc.file_path}')" class="action-btn btn-view">📱 QR কোড</button>
                        <button onclick="deleteFile('${doc.id}', '${doc.file_path}')" class="action-btn btn-delete">🗑️ ডিলিট</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        // ✏️ ৩. পাসওয়ার্ড পরিবর্তনের ফাংশন
        async function editPassword(id, oldPassword) {
            const newPassword = prompt("নতুন পাসওয়ার্ড লিখুন:", oldPassword);
            if (!newPassword || newPassword === oldPassword) return;

            if (!supabaseClient) initSupabase();

            const { error } = await supabaseClient
                .from('documents')
                .update({ password: newPassword })
                .eq('id', id);

            if (error) {
                alert("পাসওয়ার্ড আপডেট করতে সমস্যা: " + error.message);
            } else {
                alert("🎉 পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে!");
                fetchFiles();
            }
        }

        // 🗑️ ৪. ফাইল ডিলিট ফাংশন
        async function deleteFile(id, filePath) {
            if (!confirm("আপনি কি নিশ্চিত যে এই ফাইলটি মুছে ফেলতে চান?")) return;

            if (!supabaseClient) initSupabase();

            if (filePath) {
                await supabaseClient.storage.from('documents').remove([filePath]);
            }

            const { error } = await supabaseClient
                .from('documents')
                .delete()
                .eq('id', id);

            if (error) {
                alert("ডিলিট করতে সমস্যা হয়েছে: " + error.message);
            } else {
                alert("ফাইলটি সফলভাবে ডিলিট করা হয়েছে!");
                fetchFiles();
            }
        }

        // পেজ লোড হলেই ডাটা লোড হবে
        window.addEventListener('DOMContentLoaded', () => {
            initSupabase();
            fetchFiles();
        });
    </script>
</body>
</html>
