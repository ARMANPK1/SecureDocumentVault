<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Secure Document Vault</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- Supabase Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>⚙️ Admin Dashboard</h2>
      <button id="logoutBtn" style="background:#dc3545; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Logout</button>
    </div>

    <hr style="margin: 15px 0;">

    <!-- Upload Section -->
    <div class="upload-card">
      <h3>নতুন ফাইল আপলোড করুন</h3>

      <!-- 1. File Input -->
      <div style="margin-bottom: 12px;">
        <label for="fileInput"><b>ফাইল নির্বাচন করুন:</b></label><br>
        <input type="file" id="fileInput" style="margin-top: 5px;">
      </div>

      <!-- 2. Passcode Input -->
      <div style="margin-bottom: 12px;">
        <label for="passcodeInput"><b>সিক্রেট পাসওয়ার্ড (Passcode):</b></label><br>
        <input type="text" id="passcodeInput" placeholder="ফাইলের জন্য পাসওয়ার্ড দিন..." style="width:100%; padding:8px; margin-top:5px; box-sizing:border-box;">
      </div>

      <!-- 3. Upload Button -->
      <button id="uploadBtn" style="width:100%; padding:10px; background:#007bff; color:#fff; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">
        📤 ফাইল ও পাসওয়ার্ড সেভ করুন
      </button>

      <p id="statusMsg" style="margin-top:10px; color:#d9534f; font-weight:bold;"></p>
    </div>

    <!-- Generated QR & Link Section (ফাইল আপলোডের পর যা দেখাবে) -->
    <div id="resultArea" style="display:none; margin-top:20px; padding:15px; border:1px solid #28a745; background:#f8fff9; border-radius:8px; text-align:center;">
      <h4 style="color:#28a745; margin-top:0;">✅ ফাইল সফলভাবে প্রস্তুত!</h4>
      
      <!-- QR Image -->
      <div style="margin: 10px 0;">
        <img id="qrImage" src="" alt="QR Code" style="border:1px solid #ccc; padding:5px; border-radius:5px; width:180px;">
      </div>

      <!-- Share Link -->
      <p style="margin-bottom: 5px;"><b>শেয়ারেবল লিঙ্ক:</b></p>
      <input type="text" id="shareUrl" readonly style="width:100%; padding:8px; text-align:center; box-sizing:border-box; background:#fff; border:1px solid #ccc; border-radius:4px;">
    </div>
  </div>

  <!-- JavaScript Files Link -->
  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
